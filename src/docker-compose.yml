version: "3"
services:
  backend:
    container_name: backend
    build:
      context: ./backend/.
    networks:
      - mynetwork
    expose:
      - 8080
    ports:
      - "8080:8080"
    volumes:
      - backend_volume:/usr/src/app
    depends_on:
      - mariadb
  mariadb:
    container_name: mariadb
    image: mariadb:latest
    restart: always
    networks:
      - mynetwork
    env_file:
      - ./backend/.env
    volumes:
      - mariadb_data:/var/lib/mysql
    expose:
      - 3306

  dashboard:
    container_name: dashboard
    build:
      context: ./dashboard/.
    networks:
      - mynetwork
    ports:
      - "3000:3000"
    volumes:
      - dashboard_volume:/usr/src/app
    depends_on:
      - backend

  website:
    container_name: tvLexury
    image: nginx:1-alpine
    restart: always
    networks:
      - mynetwork
    ports:
      - 5000:80
    volumes:
      - ./website/:/usr/share/nginx/html
      - ./website/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php-fpm

  php-fpm:
    image: php:7.4-fpm-alpine
    restart: always
    networks:
      - mynetwork
    volumes:
      - ./website/:/usr/share/nginx/html

volumes:
  backend_volume:
    driver: local
    driver_opts:
      type: "none"
      o: 'bind'
      device: '${PWD}/src/backend/'

  dashboard_volume:
    driver: local
    driver_opts:
      type: "none"
      o: 'bind' 
      device: '${PWD}/src/dashboard/app/'
  mariadb_data:

networks:
  mynetwork:
    driver: bridge

